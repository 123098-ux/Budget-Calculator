
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Calculator - Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #dff6f0, #eef7ff);
            font-family: Arial, sans-serif;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .login-card {
            width: 100%;
            max-width: 950px;
            min-height: 550px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .left-section {
            background: linear-gradient(145deg, #087f5b, #20c997);
            color: white;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
        }

        .left-section h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .left-section p {
            font-size: 17px;
            line-height: 1.7;
            opacity: 0.95;
        }

        .money-icon {
            font-size: 90px;
            margin-bottom: 25px;
        }

        .right-section {
            padding: 55px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section h2 {
            font-weight: 700;
            color: #212529;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
            padding-left: 45px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: #20c997;
            box-shadow: 0 0 0 0.2rem rgba(32, 201, 151, 0.15);
        }

        .input-group-custom {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 15px;
            color: #20a87a;
            z-index: 5;
        }

        .login-btn {
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #087f5b, #20c997);
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(32, 201, 151, 0.3);
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .register-text a {
            color: #087f5b;
            font-weight: 600;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        #errorMessage {
            display: none;
        }

        @media (max-width: 768px) {
            .left-section {
                display: none;
            }

            .login-card {
                max-width: 500px;
            }

            .right-section {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

<div class="container-fluid login-container">

    <div class="login-card row g-0">

        <!-- LEFT SIDE -->
        <div class="col-md-6 left-section">

            <div class="money-icon">
                <i class="bi bi-wallet2"></i>
            </div>

            <h1>Smart Budget</h1>

            <p>
                Take control of your money, track your expenses,
                and understand your spending better.
            </p>

            <p>
                <i class="bi bi-check-circle-fill me-2"></i>
                Track your expenses
            </p>

            <p>
                <i class="bi bi-check-circle-fill me-2"></i>
                Calculate your savings
            </p>

            <p>
                <i class="bi bi-check-circle-fill me-2"></i>
                Manage your monthly budget
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="col-md-6 right-section">

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to continue to your budget dashboard
            </p>

            <!-- Error Message -->
            <div id="errorMessage" class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-2"></i>
                Invalid username or password.
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- Username -->
                <div class="mb-4">

                    <label class="form-label">
                        Username
                    </label>

                    <div class="input-group-custom">

                        <i class="bi bi-person input-icon"></i>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group-custom">

                        <i class="bi bi-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn login-btn w-100"
                >
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login
                </button>

            </form>


            <!-- REGISTER -->
            <div class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>

        </div>

    </div>

</div>


<script>

    const loginForm = document.getElementById("loginForm");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // Get registered user
        const storedUser = JSON.parse(localStorage.getItem("user"));

        if (
            storedUser &&
            username === storedUser.username &&
            password === storedUser.password
        ) {

            // Store login status
            localStorage.setItem("isLoggedIn", "true");

            // Go to dashboard
            window.location.href = "dashboard.html";

        } else {

            errorMessage.style.display = "block";

        }

    });

</script>

</body>
</html>
```
